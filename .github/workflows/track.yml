name: track
# Scheduled price check. Commits history back to the repo (which also keeps the
# schedule alive) and publishes docs/data.json for the Vercel dashboard.
on:
  schedule:
    - cron: "17 * * * *"   # hourly (private repo: stays within free Actions minutes; GitHub may delay runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Fail-safe: never run the tracker (and touch stored data) with broken code.
      - name: Self-test
        run: uv run pytest -q
      - name: Track prices
        id: track
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run flight-tracker
      - name: Commit data
        if: always() && steps.track.outcome != 'skipped'
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries" && exit 1
