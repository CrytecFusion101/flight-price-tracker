name: track
# Scheduled price check. Commits history back to the repo (which also keeps the
# schedule alive) and publishes docs/data.json, which the Vercel dashboard reads live from the repo.
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (public repo: unlimited minutes; GitHub may delay runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the LATEST main (not the SHA at trigger time): a run that waited in the
      # concurrency queue must build on the data the previous run just committed.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Fail-safe: never run the tracker (and touch stored data) with broken code.
      - name: Self-test
        run: uv run pytest -q
      - name: Track prices
        id: track
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run flight-tracker
      - name: Commit data
        if: always() && steps.track.outcome != 'skipped'
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git pull -q --rebase; then
              git push -q && exit 0
            else
              # Data files conflicted with a concurrent run: drop this run's snapshot
              # rather than corrupt history; the next run starts from the remote state.
              git rebase --abort || true
              echo "::warning::data conflict with a concurrent run; this run's snapshot was discarded"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "push failed after retries" && exit 1
