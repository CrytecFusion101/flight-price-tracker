name: ci
# Gate for code changes: lint, offline tests, config validation.
on:
  push:
    paths-ignore: ["data/**", "docs/data.json"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --line-length 120 src tests
      - run: uv run pytest -q
      - run: uv run flight-tracker --check-config
      - name: Dashboard data is valid JSON (if present)
        run: test ! -f docs/data.json || python3 -m json.tool docs/data.json > /dev/null
